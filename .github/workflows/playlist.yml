name: Update VOD Playlist

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */2 * * *' # প্রতি ২ ঘণ্টা পর পর অটো রান হবে
  workflow_dispatch:
    inputs:
      check_external:
        description: 'Check external dead links? (True/False)'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Playlist Generator
        env:
          CHECK_EXTERNAL_CHECK: ${{ github.event.inputs.check_external }}
        run: python playlist_generator.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add playlist.m3u movies.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist [skip ci]" && git push)
