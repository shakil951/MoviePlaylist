on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */2 * * *' # Proti 6 ghonta por por auto run hobe (No external dead check)
  workflow_dispatch:
    inputs:
      check_external:
        description: 'Check external dead links? (True/False)'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Playlist Generator
        env:
          CHECK_EXTERNAL_CHECK: ${{ github.event.inputs.check_external }}
        run: python your_script_name.py

      - name: Commit and push if changed
        # ... (apnar baki git commit er code gulo ekhane thakbe)
