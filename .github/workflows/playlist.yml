name: Update Playlist on Edit

on:
  push:
    paths:
      - 'movies.txt'              # শুধুমাত্র movies.txt এডিট হলেই রান হবে
      - 'generate_playlist.py'
  workflow_dispatch:              # প্রয়োজন হলে ম্যানুয়ালি Run করার বাটন

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Script
        run: python generate_playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto update playlist" && git push)
