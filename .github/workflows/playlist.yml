name: Update VOD Playlist

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 * * * *' # প্রতি ১ ঘণ্টা পর পর অটোমেটিক রান হবে
  workflow_dispatch:
    inputs:
      check_external:
        description: 'Check external dead links? (True/False)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests cloudscraper

      - name: Run Playlist Generator
        env:
          CHECK_EXTERNAL_CHECK: ${{ github.event.inputs.check_external || 'false' }}
        run: python generate_playlist.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # -f ব্যবহার করে জোরপূর্বক ফাইল অ্যাড করা হচ্ছে
          git add -f playlist.m3u movies.txt
          git status
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update playlist via Cron/Manual [skip ci]"
            # নির্দিষ্ট ব্রাঞ্চে (main) পুশ করার সঠিক কমান্ড
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
