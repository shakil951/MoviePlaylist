name: Update VOD Playlist

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      check_external:
        description: 'Check external dead links? (True/False)'
        required: false
        type: boolean
        default: false

# একাধিক রিকোয়েস্ট ওভারল্যাপ ঠেকানোর জন্য Concurrency লক
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Playlist Generator
        env:
          CHECK_EXTERNAL_CHECK: ${{ github.event.inputs.check_external || 'false' }}
        run: python generate_playlist.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add playlist.m3u movies.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update playlist [skip ci]"
            git pull origin main --rebase
            git push
          else
            echo "No changes to commit."
          fi
