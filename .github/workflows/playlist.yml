name: Auto Update Playlist

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় রাত ১২টায় (UTC সন্ধ্যা ৬টায়) রান হবে
    - cron: '0 18 * * *'
  workflow_dispatch: # চাইলে আপনি নিজেও Actions ট্যাব থেকে যখন খুশি Run করতে পারবেন

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # বটকে ফাইলে লেখার পারমিশন দেওয়া

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Generator Script
        run: python generate_playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto update playlist" && git push)
