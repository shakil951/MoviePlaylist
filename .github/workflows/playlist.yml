name: Auto Update Playlist

on:
  push:
    paths:
      - 'movies.txt'          # শুধু movies.txt ফাইলে পরিবর্তন হলে সাথে সাথে রান হবে
  schedule:
    - cron: '0 */2 * * *'     # সিডিএন সাবডোমেইন পরিবর্তনের জন্য প্রতি ২ ঘণ্টা পরপর চলবে
  workflow_dispatch:          # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Playlist Generator
        run: python generate_playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Farabi TV Bot"
          git config --global user.email "bot@farabi.tv"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto: Update playlist on movies.txt change" && git push)
