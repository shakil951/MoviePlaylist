name: Update VOD Playlist

on:
  push:
    branches: [ "main" ]

  # Cron job বন্ধ রাখা হয়েছে; শুধু manual (workflow_dispatch) বা push দিয়ে চলবে
  # schedule:
  #   - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      check_external:
        description: 'Check external dead links? (True/False)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests cloudscraper playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Playlist Generator
        env:
          CHECK_EXTERNAL_CHECK: ${{ github.event.inputs.check_external || 'false' }}
          LIVE_SUBDOMAIN: ${{ secrets.LIVE_SUBDOMAIN }}
        run: python generate_playlist.py

      - name: Commit and push if playlist or domain changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git add -f playlist.m3u movies.txt last_domain.txt

          git status
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update playlist & last_domain via workflow [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
